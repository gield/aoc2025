[project]
name = "aoc2025"
version = "0.1.0"
description = "Advent of Code 2025"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "E741",  # allow using I, l, O as variable names
]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
warn_unreachable = true
